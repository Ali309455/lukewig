<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0AA" />
      <stop offset="30%" stop-color="#DFBA68" />
      <stop offset="70%" stop-color="#C79B3D" />
      <stop offset="100%" stop-color="#9A7224" />
    </linearGradient>

    <!-- Rose Pink Metallic Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAD4E0" />
      <stop offset="40%" stop-color="#EF5D8F" />
      <stop offset="100%" stop-color="#B83B66" />
    </linearGradient>

    <!-- Circle Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B4C8" />
      <stop offset="50%" stop-color="#D99B6A" />
      <stop offset="100%" stop-color="#EF5D8F" />
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(300, 105)" text-anchor="middle">
    <!-- Dual Outer Ring -->
    <circle r="92" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.9" />
    <circle r="98" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" stroke-dasharray="280 20" />

    <!-- Sparkle Stars on Ring -->
    <path d="M 85,-40 L 88,-37 L 91,-40 L 88,-43 Z" fill="#FFF" />
    <path d="M -85,40 L -82,43 L -79,40 L -82,37 Z" fill="#F3E0AA" />

    <!-- Queen Profile Silhouette with Crown -->
    <g transform="translate(-10, -55) scale(0.85)">
      <!-- Hair & Head Contour -->
      <path d="M -5,5 C -25,-10 -25,-35 -5,-45 C 10,-52 25,-40 30,-25 C 33,-15 35,-5 25,10 C 20,18 10,25 -5,28 C -15,22 -20,12 -5,5 Z" fill="#1F1A1C" />
      <!-- Wavy Flowing Locks -->
      <path d="M 12,-35 Q 35,-40 45,-15 Q 52,10 32,35 Q 18,50 38,65 Q 45,72 25,75 Q 10,60 15,40 Q 22,15 12,-35 Z" fill="#2D2327" />

      <!-- Golden Tiara Crown -->
      <path d="M -15,-45 L -10,-58 L -2,-48 L 8,-62 L 18,-48 L 26,-56 L 28,-43 Z" fill="url(#goldGrad)" />
      <circle cx="-10" cy="-58" r="2" fill="#FFF" />
      <circle cx="8" cy="-62" r="2.5" fill="#FFF" />
      <circle cx="26" cy="-56" r="2" fill="#FFF" />

      <!-- Hoop Earring -->
      <circle cx="-12" cy="-10" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    </g>

    <!-- Overlapping Golden V -->
    <path d="M -45,-25 L -22,45 L -8,45 L 15,-25 L 0,-25 L -15,22 L -30,-25 Z" fill="url(#goldGrad)" filter="url(#glow)" />

    <!-- Overlapping Cursive Pink V -->
    <path d="M -22,-32 C -35,-20 -20,0 -12,22 Q -2,46 18,-15 C 26,-35 48,-35 42,-22 C 36,-10 15,10 -2,48 C -8,60 -18,52 -18,40 Q -18,15 -22,-32 Z" fill="url(#roseGrad)" opacity="0.95" />

    <!-- Diamond Accent at Ring Bottom -->
    <g transform="translate(0, 92) scale(0.9)">
      <polygon points="0,-7 7,0 0,7 -7,0" fill="url(#goldGrad)" />
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#FFF" opacity="0.7" />
    </g>
  </g>

  <!-- Typography: VERSATILE -->
  <text x="300" y="235" text-anchor="middle" font-family="'Cormorant Garamond', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="8" fill="url(#goldGrad)">
    VERSATILE
  </text>

  <!-- Subheader: BY VERSHA' -->
  <text x="300" y="265" text-anchor="middle" font-family="'Poppins', 'Montserrat', sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="url(#roseGrad)">
    BY VERSHA'
  </text>

  <!-- Tagline: One Woman. Every Look. -->
  <text x="300" y="295" text-anchor="middle" font-family="'Brush Script MT', 'Great Vibes', 'Cormorant Garamond', cursive, serif" font-size="18" font-style="italic" font-weight="500" letter-spacing="2" fill="#E88BB0">
    One Woman. Every Look.
  </text>
</svg>
